[project]
name = "thorn"
version = "3.0.0"
description = "An optimizer"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "torch>=2.6"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
"Source code" = "https://github.com/pykeio/THORN"

[tool.ty.environment]
python = ".venv"
